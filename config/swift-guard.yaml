# Swift-Guard Configuration
# Main configuration file for swift-guard-daemon (default path: /etc/swift-guard/config.yaml).
#
# Every key is optional; a missing key uses the default shown here.
# Unknown keys and keys removed in newer versions are ignored with a warning in the daemon log
# (an older config file keeps working after an upgrade). Invalid values stop the daemon at startup.
#
# Removed keys (ignored with a warning if still present):
#   general.work_dir, general.pid_file   - unused; systemd manages the process
#   telemetry.export_enabled/export_url  - telemetry export is not implemented
#   interfaces                           - use `swift-guard-daemon -i <ifname>` (systemd override, README ch.10)
#   rules                                - add rules with `xdp-filter add-rule`, e.g. a rules.sh run by
#                                          ExecStartPost (README ch.10)

# General settings
general:
  # Log level: off, error, warn, info, debug, trace (default: info)
  # Precedence: `-v/--verbose` (debug) > RUST_LOG environment variable (if set and non-empty)
  #             > this value > info
  log_level: "info"

# Telemetry settings
telemetry:
  # Periodically log rule-match statistics (default: true)
  log_stats: true
  # Statistics collection interval in seconds (default: 10, 0 is treated as 1)
  interval: 10

# WASM runtime settings
wasm:
  # Base directory for relative paths in auto_load_modules
  modules_dir: "/usr/local/lib/swift-guard/wasm"
  # Load auto_load_modules in the background after the API server starts (default: false).
  # A module that fails to load is logged as an error; the daemon keeps running.
  auto_load: false
  # .wasm files to load: absolute path, or relative to modules_dir.
  # The module name is the file name without extension (http_inspector.wasm -> http_inspector).
  # Example: ["http_inspector.wasm"]
  auto_load_modules: []
  # Time limit for each guest call (allocate / inspect_packet / deallocate) in milliseconds
  # (default: 10, allowed: 1-10000). Takes effect when inspect_packet is called;
  # the XDP data path does not call WASM yet.
  execution_timeout_ms: 10
  # Linear memory limit per module in MiB (default: 32, allowed: 1-4096). Applied at load time.
  memory_limit_mb: 32
