[package]
name = "swift-guard"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Secure WebAssembly Inspection Framework for Traffic using Guard"
readme = "README.md"
repository = "https://github.com/uni2u/swift-guard"
license = "GPL-2.0"
keywords = ["xdp", "ebpf", "network", "security", "wasm"]
categories = ["network-programming", "command-line-utilities"]

[workspace]
members = [
    "src/cli",
    "src/daemon",
    "src/common",
]
# `cargo build --release` 가 두 바이너리(xdp-filter, swift-guard-daemon)를 계속 만들도록 한다.
# (루트 [[bin]] 중복 정의는 제거됨 — 각 바이너리는 자기 패키지에서만 빌드된다)
default-members = [".", "src/cli", "src/daemon", "src/common"]

[dependencies]
libbpf-rs = "0.19"
libc = "0.2"
clap = { version = "4.3", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.28", features = ["full"] }
log = "0.4"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.4"
nix = "0.26"
wasmtime = "12.0"
chrono = "0.4"
ctrlc = "3.4"
ipnet = "2.8"
crossbeam-channel = "0.5"
serde_yaml = "0.9"

[lib]
name = "swift_guard"
path = "src/common/lib.rs"

# 통합 테스트 (root 권한·실제 인터페이스 필요 → #[ignore])
[[test]]
name = "test_basic_filtering"
path = "tests/integration/test_basic_filtering.rs"

[[test]]
name = "test_wasm_integration"
path = "tests/integration/test_wasm_integration.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
# unwind: panic 시에도 daemon 의 DetachGuard(Drop)가 XDP 를 떼도록 한다 (R2-2)
panic = "unwind"
